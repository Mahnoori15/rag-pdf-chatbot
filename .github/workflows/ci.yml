name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-pdf-chatbot .
      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 7860:7860 rag-pdf-chatbot
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7860/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
